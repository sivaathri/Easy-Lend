<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none">
  <!-- Map Land / Parks Background -->
  <rect width="300" height="80" fill="#e5eee4"/>
  <path d="M40,0 L80,80 L160,80 L120,0 Z" fill="#d6e8d4"/>
  <path d="M190,0 L240,80 L300,80 L300,0 Z" fill="#dcecdb"/>
  <!-- Secondary Roads (Light Cream) -->
  <path d="M-10,20 L310,65" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M-10,55 L310,15" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M90,-10 L140,90" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M210,-10 L250,90" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Primary Arterial Highway (Warm Gold/Yellow) -->
  <path d="M-10,32 Q140,46 310,24" stroke="#fde68a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Highway Centerline -->
  <path d="M-10,32 Q140,46 310,24" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 3"/>
  <!-- Soft Left Fade into Dark Green -->
  <rect width="90" height="80" fill="url(#leftFade)"/>
  <defs>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00382b" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00382b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00382b" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

